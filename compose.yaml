services:
  # ========================================
  # Production Service
  # ========================================
  api-prod:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: api-prod
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      # This secret would definitely NOT go here in a production env
      # but we need it to make the app work locally with just 'docker compose up' 
      #  (unless we had a .env file config step before that command because .env is not versioned
      #  or a deploy pipeline w/ secret injection) 
      JWT_SECRET: '63f4945d921d599f27ae4fdf5bada3f1'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: '${PROD_MEMORY_LIMIT:-2G}'
          cpus: '${PROD_CPU_LIMIT:-1.0}'
        reservations:
          memory: '${PROD_MEMORY_RESERVATION:-512M}'
          cpus: '${PROD_CPU_RESERVATION:-0.25}'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - api-network

# ========================================
# Network Configuration
# ========================================
networks:
  api-network:
    name: api-network
    driver: bridge